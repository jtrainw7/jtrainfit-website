<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTrainFit — Get In</title>
<meta name="description" content="1-on-1 coaching built on evidence-based training and real accountability. Drop your email to get in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --bg-panel: #1a1a1a;
    --charcoal: #1c1c1e;
    --gold: #c9a54e;
    --gold-dim: #8a7238;
    --off-white: #f2efe9;
    --gray: #8a8780;
    --line: #2c2c2c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* subtle textural backdrop — a single quiet gesture, not decoration everywhere */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,165,78,0.08), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  .mark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 28px;
    opacity: 0;
    animation: rise 0.6s ease-out forwards;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 62px);
    line-height: 0.98;
    letter-spacing: 0.01em;
    color: var(--off-white);
    text-transform: uppercase;
    opacity: 0;
    animation: rise 0.6s ease-out 0.08s forwards;
  }

  h1 span {
    color: var(--gold);
  }

  .sub {
    font-size: 16px;
    line-height: 1.55;
    color: var(--gray);
    max-width: 380px;
    margin: 18px auto 0;
    opacity: 0;
    animation: rise 0.6s ease-out 0.16s forwards;
  }

  .bar {
    width: 40px;
    height: 2px;
    background: var(--gold-dim);
    margin: 28px auto;
    opacity: 0;
    animation: rise 0.6s ease-out 0.22s forwards;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    opacity: 0;
    animation: rise 0.6s ease-out 0.3s forwards;
  }

  .field-row {
    display: flex;
    gap: 8px;
  }

  input[type="email"] {
    flex: 1;
    background: var(--charcoal);
    border: 1px solid var(--line);
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 16px 18px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s ease;
    min-width: 0;
  }

  input[type="email"]::placeholder {
    color: #5c5a55;
  }

  input[type="email"]:focus {
    border-color: var(--gold-dim);
  }

  button {
    background: var(--gold);
    color: #17140a;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 16px 26px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  button:hover {
    background: #dcb861;
  }

  button:active {
    transform: scale(0.98);
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .fine {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #5c5a55;
    margin-top: 16px;
    opacity: 0;
    animation: rise 0.6s ease-out 0.38s forwards;
  }

  .success {
    display: none;
    padding: 22px 20px;
    border: 1px solid var(--gold-dim);
    border-radius: 3px;
    background: rgba(201,165,78,0.06);
  }

  .success.show {
    display: block;
    animation: rise 0.5s ease-out forwards;
  }

  .success p:first-child {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--off-white);
    margin-bottom: 6px;
  }

  .success p:last-child {
    font-size: 14px;
    color: var(--gray);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark, h1, .sub, .bar, form, .fine, .success {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  @media (max-width: 420px) {
    .field-row {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="mark">JTRAINFIT</div>
    <h1>Get in <span>shape.</span><br>Get on the <span>list.</span></h1>
    <p class="sub">Evidence-based coaching, real accountability. Drop your email and I'll send you the details on what it looks like to train with me.</p>
    <div class="bar"></div>

    <form id="optin-form">
      <div class="field-row">
        <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email">
        <button type="submit">Count me in</button>
      </div>
    </form>

    <div class="success" id="success-msg">
      <p>You're in.</p>
      <p>Check your inbox — first message is on its way.</p>
    </div>

    <div class="fine">No spam. Unsubscribe anytime.</div>
  </div>

<script>
  // ---------------------------------------------------------------
  // LEAD CAPTURE ENDPOINT — connect this to Systeme.io
  // ---------------------------------------------------------------
  // 1. In Systeme.io: Marketing > Opt-in Funnels (or Campaigns) >
  //    create a "Squeeze Page" funnel step and grab its Form ID,
  //    OR create a standalone Contact Form under Marketing > Forms.
  // 2. Systeme.io forms give you an embeddable <form> action URL
  //    that looks like: https://systeme.io/funnel-step/{id}/optin
  //    or a webhook URL for API-based capture.
  // 3. Paste that URL below as SYSTEME_ENDPOINT.
  // 4. If Systeme.io's form requires a specific hidden field name
  //    for the email input, rename "email" below to match theirs
  //    (they'll show you the exact field name in the embed code
  //    they generate — usually "email" or "systemeio_email").
  // ---------------------------------------------------------------

  const SYSTEME_ENDPOINT = "https://systeme.io/embedded/44388710/subscription";

  const form = document.getElementById('optin-form');
  const successMsg = document.getElementById('success-msg');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    const btn = form.querySelector('button');
    const originalText = btn.textContent;
    btn.textContent = 'Sending...';
    btn.disabled = true;

    // If the endpoint hasn't been set yet, don't attempt a fetch —
    // just log locally so testing the page doesn't error out.
    if (SYSTEME_ENDPOINT.startsWith('PASTE_')) {
      console.warn('Systeme.io endpoint not configured yet. Email captured locally only:', email);
      form.style.display = 'none';
      successMsg.classList.add('show');
      return;
    }

    try {
      await fetch(SYSTEME_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors', // Systeme.io endpoints are typically cross-origin form posts
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ email: email })
      });
      form.style.display = 'none';
      successMsg.classList.add('show');
    } catch (err) {
      btn.textContent = originalText;
      btn.disabled = false;
      alert('Something went wrong — try again in a second.');
    }
  });
</script>

</body>
</html>
